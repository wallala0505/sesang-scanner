name: daily
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      skip_brief:
        description: 'skip daily brief (test other jobs only)'
        type: boolean
        default: false
      force_weekly:
        description: 'run weekly report now'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      PREDEXON_KEY: ${{ secrets.PREDEXON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: daily-${{ github.run_id }}
          restore-keys: daily-
      - name: skip if already sent today (KST)
        id: guard
        run: |
          d=$(TZ=Asia/Seoul date +%F)
          if [ "$(cat state/daily_sent 2>/dev/null)" = "$d" ]; then echo skip=1 >> $GITHUB_OUTPUT; else echo skip=0 >> $GITHUB_OUTPUT; fi
      - name: daily brief (prediction markets)
        if: ${{ !inputs.skip_brief && steps.guard.outputs.skip != '1' }}
        run: |
          node daily.mjs || echo "daily error"
          mkdir -p state && TZ=Asia/Seoul date +%F > state/daily_sent
      - name: options chain daily (CBOE + CRSI)
        if: ${{ steps.guard.outputs.skip != '1' }}
        run: node options.mjs || echo "options error"
      - name: Kalshi vs Polymarket gaps
        if: ${{ steps.guard.outputs.skip != '1' }}
        run: node arb.mjs || echo "arb error"
      - name: weekly hypothesis test (Sundays KST)
        if: ${{ steps.guard.outputs.skip != '1' }}
        env:
          FORCE: ${{ inputs.force_weekly && '1' || '' }}
        run: node weekly.mjs || echo "weekly error"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: daily-${{ github.run_id }}
      - name: keepalive commit (scheduled workflows stop after 60 days without activity)
        run: |
          date -u > .keepalive
          git config user.name scanner-bot
          git config user.email scanner-bot@users.noreply.github.com
          git pull --rebase || true
          git add .keepalive
          git commit -m "keepalive" && git push || true
